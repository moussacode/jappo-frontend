<section class="relative w-full overflow-hidden py-20 md:py-28">
  <!-- Phrase géante qui défile en fond -->
  @if (marqueeLine()) {
    <div
      aria-hidden="true"
      class="pointer-events-none absolute inset-0 flex select-none items-center overflow-hidden"
    >
      <div class="cta-marquee-track flex w-max shrink-0 whitespace-nowrap text-ink/[0.06]">
        @for (copy of [0, 1]; track copy) {
          <span class="text-[22vw] font-bold leading-none tracking-tighter md:text-[16vw]">{{ marqueeLine() }}</span>
        }
      </div>
    </div>
  }

  <!-- Message centré -->
  <div appRevealOnView class="relative mx-auto flex max-w-4xl flex-col items-center px-6 text-center">
    @if (badge()) {
      <span class="inline-flex items-center gap-2 rounded-full border border-line bg-surface/80 px-3 py-1 text-xs font-semibold text-ink-muted backdrop-blur">
        <span class="size-1.5 rounded-full bg-accent"></span>
        {{ badge() }}
      </span>
    }

    @if (heading()) {
      <h2 class="mt-8 text-balance text-4xl font-bold leading-[1.05] tracking-tight text-ink md:text-5xl lg:text-6xl">
        {{ heading() }}
      </h2>
    }

    @if (note()) {
      <p class="mt-6 max-w-xl text-balance text-base text-ink-muted md:text-lg">
        {{ note() }}
      </p>
    }

    <div class="mt-10 flex flex-col items-center justify-center gap-3 sm:flex-row">
      <ng-content />
    </div>

    @if (footnote()) {
      <p class="mt-8 text-sm text-ink-faint">{{ footnote() }}</p>
    }
  </div>
</section>
