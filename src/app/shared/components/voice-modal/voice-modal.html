<!-- ════════════════════════════════════════════════════════════════════════
     Modal Mode Vocal — JAPPO (Carte centrée simple)
     États : IDLE | LISTENING | PROCESSING | SPEAKING | ERROR
     ════════════════════════════════════════════════════════════════════════ -->

<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 transition-opacity duration-300"
     (click)="onClose()">

  <!-- ── Conteneur de la Modale ──────────────────────────────────────────── -->
  <div class="relative w-full max-w-md flex flex-col bg-neutral-900 border border-white/10 rounded-3xl shadow-2xl overflow-hidden" 
       (click)="$event.stopPropagation()">

    <!-- Bouton Fermer (Haut Droite) -->
    <button class="absolute top-4 right-4 p-2 rounded-full text-white/40 hover:text-white hover:bg-white/10 transition-colors z-20"
            (click)="onClose()" title="Fermer l'assistant">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <!-- ── Corps : L'Orbe & Textes ──────────────────────────────────────── -->
    <div class="flex flex-col items-center pt-12 pb-6 px-6">
      
      <!-- L'Orbe Interactif (Taille réduite pour la carte) -->
      <div class="relative flex items-center justify-center w-40 h-40 mb-6">
        
        <!-- Halo de résonance -->
        <div class="absolute inset-0 rounded-full bg-blue-400/20 blur-2xl transition-all duration-300 ease-out"
             [style.transform]="'scale(' + (1 + audioLevel() * 1.5) + ')'"
             [class.opacity-0]="!isListening() && !isSpeaking()">
        </div>

        <!-- Sphère Principale -->
        <button
          class="relative z-10 flex items-center justify-center rounded-full transition-all duration-[50ms] ease-out focus:outline-none"
          [class]="isProcessing() ? 'w-16 h-16 animate-pulse' : 'w-24 h-24'"
          [style.transform]="(isListening() || isSpeaking()) ? 'scale(' + (1 + audioLevel() * 0.4) + ')' : 'scale(1)'"
          [style.box-shadow]="isProcessing() ? '0 0 30px rgba(255,255,255,0.1)' : '0 0 40px -10px rgba(147, 197, 253, 0.3)'"
          (click)="isListening() ? onMicClick() : (isSpeaking() ? onInterrupt() : onMicClick())"
        >
          <!-- Gradient de la sphère -->
          <div class="absolute inset-0 rounded-full bg-gradient-to-b from-white via-[#dbeafe] to-[#93c5fd]"
               [class.animate-[spin_4s_linear_infinite]]="isProcessing()">
          </div>

          <!-- Icône centrale au repos -->
          @if (!isListening() && !isProcessing() && !isSpeaking()) {
            <svg class="relative z-20 w-8 h-8 text-blue-900/40" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 1 1-8 0V5a4 4 0 0 1 4-4z"/>
              <path d="M19 10a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V21H9v2h6v-2h-2v-2.06A9 9 0 0 0 21 10h-2z"/>
            </svg>
          }
        </button>
      </div>

      <!-- Zone de Texte -->
      <div class="flex flex-col items-center w-full text-center min-h-[5rem] justify-center">
        @if (transcript()) {
          <p class="text-white/90 text-lg font-light leading-snug animate-in fade-in duration-500 line-clamp-3">
            {{ transcript() }}
          </p>
        } @else {
          <h3 class="text-white/40 text-sm font-medium tracking-wide uppercase transition-all duration-300">
            {{ isProcessing() ? 'Réflexion...' : stateLabel() }}
          </h3>
        }
      </div>
    </div>

    <!-- ── Pied de page : Contrôles (Style Barre d'outils) ──────────────── -->
    <div class="flex items-center justify-between px-6 py-4 bg-white/5 border-t border-white/10">
      
      <!-- Toggle Mode Continu -->
      <button class="group flex items-center gap-3 focus:outline-none" (click)="onToggleAutoLoop()">
        <div class="relative inline-flex h-5 w-9 rounded-full transition-colors duration-300"
             [class.bg-white]="autoLoop()"
             [class.bg-white/20]="!autoLoop()">
          <span class="inline-block w-4 h-4 bg-black rounded-full transform transition-transform duration-300 mt-0.5"
                [class.translate-x-4]="autoLoop()"
                [class.translate-x-0.5]="!autoLoop()">
          </span>
        </div>
        <span class="text-white/50 text-xs font-medium group-hover:text-white/80 transition-colors">
          Continu
        </span>
      </button>

      <div class="flex items-center gap-3">
        <!-- Bouton Micro Manuel -->
        <button class="flex items-center justify-center w-10 h-10 rounded-full transition-all duration-200"
                [class]="isListening() ? 'bg-white text-black' : 'bg-white/10 text-white hover:bg-white/20'"
                (click)="onMicClick()">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            @if (isListening()) {
              <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            }
          </svg>
        </button>

        <!-- Bouton Raccrocher -->
        <button class="flex items-center justify-center w-10 h-10 rounded-full bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white transition-all duration-200"
                (click)="onClose()">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z" />
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>
