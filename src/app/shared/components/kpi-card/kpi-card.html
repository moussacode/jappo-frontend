<div class="lg-surface flex h-full flex-col justify-between overflow-hidden rounded-[var(--radius-card-lg)] p-4 transition-colors hover:border-line-strong sm:p-5">

  <div class="flex items-start justify-between gap-3">
    <p class="line-clamp-2 text-[13px] font-medium leading-snug text-ink-muted" [title]="label()">
      {{ label() }}
    </p>
    @if (icon(); as i) {
      <span class="flex size-8 shrink-0 items-center justify-center text-ink-faint">
        <app-icon [name]="i" class="size-4" />
      </span>
    }
  </div>

  <p class="mt-2 text-2xl font-bold tracking-tight text-ink tabular-nums sm:text-3xl">{{ value() }}</p>

  <div>
    @if (trend()) {
      <div class="mt-3 flex items-center gap-1.5 text-[11px] font-medium sm:text-xs">
        <span [class]="trendColorClass()" class="inline-flex items-center gap-0.5 rounded-full bg-surface-muted px-1.5 py-0.5 font-semibold">
          {{ trendDirection() === 'up' ? '↗' : trendDirection() === 'down' ? '↘' : '→' }} {{ trend() }}
        </span>
        <span class="text-ink-faint">{{ trendLabel() }}</span>
      </div>
    } @else if (note()) {
      <p class="mt-3 text-[11px] font-medium leading-snug sm:text-xs" [class]="noteColorClass()">
        {{ note() }}
      </p>
    }
  </div>

</div>
