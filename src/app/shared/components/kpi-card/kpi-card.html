<div class="flex glass-surface flex-col justify-between h-full rounded-[var(--radius-card-lg)] border border-line bg-surface p-3 sm:p-4 md:p-6 shadow-[var(--shadow-subtle)] transition-all hover:border-line-strong">

  <!-- Partie supérieure : Label et Valeur -->
  <div>
    <p class="text-[10px] sm:text-xs font-semibold tracking-wider text-ink-muted uppercase truncate" [title]="label()">
      {{ label() }}
    </p>
    <p class="mt-2 text-xl sm:text-2xl md:text-3xl font-bold tracking-tight text-ink">{{ value() }}</p>
  </div>

  <!-- Partie inférieure : Tendance ou Note (toujours alignée en bas) -->
  <div>
    @if (trend()) {
      <div class="mt-3 sm:mt-4 flex items-center gap-1.5 text-[10px] sm:text-xs font-medium">
        <span class="text-ink-faint">{{ trendLabel() }}:</span>
        <span [class]="trendColorClass()" class="inline-flex items-center gap-1 font-semibold">
          {{ trend() }}
          @if (trendDirection() === 'up') {
            <span>↗</span>
          } @else {
            <span>↘</span>
          }
        </span>
      </div>
    } @else if (note()) {
      <p class="mt-3 sm:mt-4 text-[10px] sm:text-xs font-medium leading-snug" [class]="noteColorClass()">
        {{ note() }}
      </p>
    }
  </div>

</div>
