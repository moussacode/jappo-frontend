<div class="rounded-[var(--radius-token-md)] border border-neutral-200 bg-white p-5">
      <p class="text-xs font-medium text-neutral-500">{{ label() }}</p>
      <p class="mt-1.5 text-3xl font-semibold text-neutral-900">{{ value() }}</p>
      @if (note()) {
        <p class="mt-1.5 text-xs" [class]="noteColorClass()">{{ note() }}</p>
      }
    </div>
