<div class="flex min-h-screen items-center justify-center bg-neutral-25 p-6">
      <div class="w-full max-w-[440px] rounded-[var(--radius-token-lg)] border border-neutral-200 bg-white p-10">
         <div class="flex h-18 justify-center items-center">
    <img
      src="/logo.png"
      alt="JAPPO"
      class="h-full w-auto object-contain"
    />
  </div>

        <div class="mt-6 mb-6">
          <h1 class="text-xl font-semibold text-neutral-900">Content de te revoir</h1>
          <p class="mt-1 text-sm text-neutral-500">Connecte-toi pour retrouver ton parcours</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
          <div class="flex flex-col gap-2">
            <label for="email" class="text-xs font-medium text-neutral-500">ADRESSE EMAIL</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="awa.ndiaye@email.com"
              class="rounded-[var(--radius-token-sm)] border border-neutral-200 px-3.5 py-2.5 text-sm focus:border-brand-500 focus:outline-none"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="motDePasse" class="text-xs font-medium text-neutral-500">MOT DE PASSE</label>
            <input
              id="motDePasse"
              type="password"
              formControlName="motDePasse"
              placeholder="••••••••"
              class="rounded-[var(--radius-token-sm)] border border-neutral-200 px-3.5 py-2.5 text-sm focus:border-brand-500 focus:outline-none"
            />
          </div>

          @if (errorMessage()) {
            <p class="text-sm text-danger-500">{{ errorMessage() }}</p>
          }

          <app-button type="submit" [disabled]="form.invalid || submitting()">
            {{ submitting() ? 'Connexion en cours…' : 'Se connecter' }}
          </app-button>
        </form>

        <p class="mt-4 text-center text-sm text-neutral-500">
          Pas encore de compte ?
          <a routerLink="/inscription" class="font-medium text-brand-500">Créer un compte</a>
        </p>
      </div>
    </div>
